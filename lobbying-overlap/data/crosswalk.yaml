# Crosswalk: LDA issue codes → sector, tickers → sector.
# (Committee → sector lives in data/committee_jurisdictions.yaml; the
# crosswalk loader reads both and validates them against the same
# sector vocabulary.)
#
# THIS FILE IS THE CORE ASSET. If it is wrong the whole product is wrong.
# See CLAUDE.md "The join".
#
# Schema:
#   sectors:        canonical vocabulary. Every sector referenced anywhere
#                   (here or in committee_jurisdictions.yaml) must be listed.
#   issue_codes:    CODE: {name: ..., sectors: {sector: confidence, ...}}
#                   `sectors: {}` means "intentionally maps to no sector"
#                   (e.g. REL) — distinct from a code missing entirely,
#                   which the resolver reports as unmapped.
#   tickers:
#     overrides:    TICKER: {sector: confidence, ...} — checked first.
#     gics:         GICS sector name (snake_case) → {sector: confidence}.
#                   Fallback when no override exists and the caller knows
#                   the ticker's GICS sector.
#
# confidence: high / medium / low. Rule ids are derived, not hand-written:
#   ic:CODE->sector   tk:TICKER->sector   gics:key->sector   com:ID->sector
# Output rows expose these so users can audit which row fired.
#
# Neutral language only — mappings describe subject-matter relevance,
# not conduct.

version: 1

