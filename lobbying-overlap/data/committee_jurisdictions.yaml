# Committee → sector jurisdiction tags.
#
# Hand-editable. This file is the committee leg of the three-way crosswalk
# (issue codes / tickers / committee jurisdiction — see CLAUDE.md).
#
# Rules:
# - Key = thomas_id from unitedstates/congress-legislators (HSAS, SSFI, ...).
# - Subcommittees (e.g. HSAS28) inherit the parent committee's sectors
#   unless listed here explicitly with their own entry.
# - `sectors` is a list of lowercase snake_case tags. Keep the vocabulary
#   aligned with data/crosswalk.yaml sector names.
# - Committees missing from this file get the tag `unmapped` and are
#   reported in the run summary — never silently dropped.
# - Neutral language only. Tags describe jurisdiction, not conduct.

