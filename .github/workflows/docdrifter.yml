name: DocDrifter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  check-docs-senate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seralifatih/docdrifter@v1
        with:
          src-path: "senate/src/"
          docs-path: "senate/README.md"
          repo-description: "an Apify actor and REST API that pulls U.S. Senate Periodic Transaction Reports (STOCK Act) from the Senate eFD and emits normalized, deduplicated trade records"

  check-docs-house:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seralifatih/docdrifter@v1
        with:
          src-path: "house/src/"
          docs-path: "house/README.md"
          repo-description: "an Apify actor that pulls U.S. House Periodic Transaction Reports (STOCK Act) from the Clerk of the House, parses the filing PDFs, and emits normalized, deduplicated trade records"
